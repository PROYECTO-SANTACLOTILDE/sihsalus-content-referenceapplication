name: Validate with SIHSALUS

on:
  push:
    branches: [main, pre-release]
  workflow_dispatch:
    inputs:
      sihsalus_ref:
        description: SIHSALUS branch, tag, or SHA to validate against
        required: false
        default: main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout content package
        uses: actions/checkout@v4
        with:
          path: content-package

      - name: Read content package version
        id: content
        working-directory: content-package
        run: |
          CONTENT_VERSION="$(sed -n 's:.*<version>\([^<]*\)</version>.*:\1:p' pom.xml | head -1)"
          if [ -z "$CONTENT_VERSION" ]; then
            echo "Unable to read project version from pom.xml"
            exit 1
          fi
          echo "Content package version: ${CONTENT_VERSION}"
          echo "version=${CONTENT_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Verify content package is published
        run: |
          URL="https://repo1.maven.org/maven2/io/github/proyecto-santaclotilde/sihsalus-content/${{ steps.content.outputs.version }}/sihsalus-content-${{ steps.content.outputs.version }}.zip"
          for attempt in $(seq 1 30); do
            if curl -fsI "$URL"; then
              exit 0
            fi
            echo "Content package is not available yet in Maven Central; retry ${attempt}/30."
            sleep 30
          done
          echo "Content package did not become available in Maven Central: $URL"
          exit 1

      - name: Checkout SIHSALUS
        uses: actions/checkout@v4
        with:
          repository: sihsalus/sihsalus
          ref: ${{ inputs.sihsalus_ref || 'main' }}
          path: sihsalus

      - name: Use current content package in SIHSALUS backend
        working-directory: sihsalus
        run: |
          sed -i "s|<sihsalus-content.version>.*</sihsalus-content.version>|<sihsalus-content.version>${{ steps.content.outputs.version }}</sihsalus-content.version>|" backend/pom.xml
          sed -i "s|content.sihsalus=|content.sihsalus-content=|" backend/distro.properties
          sed -i "s|content.sihsalus.namespace=|content.sihsalus-content.groupId=io.github.proyecto-santaclotilde\\ncontent.sihsalus-content.namespace=|" backend/distro.properties
          grep -n "<sihsalus-content.version>" backend/pom.xml
          grep -n "content.sihsalus-content" backend/distro.properties

      - name: Configure SIHSALUS validation runtime
        working-directory: sihsalus
        run: |
          cat > .env <<'EOF'
          MYSQL_OPENMRS_PASSWORD=openmrs
          MYSQL_ROOT_PASSWORD=openmrs
          OMRS_OCL_TOKEN=
          EOF

      - name: Build SIHSALUS backend image with current content package
        working-directory: sihsalus
        run: docker build -t openmrs/openmrs-reference-application-3-backend:content-validation -f backend/Dockerfile .

      - name: Start SIHSALUS backend
        working-directory: sihsalus
        env:
          TAG: content-validation
        run: docker compose -f docker-compose-no-volumes.yml up -d db backend

      - name: Wait for backend startup
        working-directory: sihsalus
        run: |
          timeout 30m bash -c '
            until curl -fsS http://localhost:8080/openmrs/health/started; do
              docker compose -f docker-compose-no-volumes.yml ps
              if ! docker compose -f docker-compose-no-volumes.yml ps --status running --services | grep -qx backend; then
                docker compose -f docker-compose-no-volumes.yml logs backend
                exit 1
              fi
              sleep 20
            done
          '

      - name: Capture backend logs
        if: always() && hashFiles('sihsalus/docker-compose-no-volumes.yml') != ''
        run: docker compose -f sihsalus/docker-compose-no-volumes.yml logs backend | tee sihsalus/sihsalus-content-validation.log

      - name: Classify validation log errors
        working-directory: sihsalus
        run: |
          python3 ../content-package/.github/scripts/content_ci.py classify-log sihsalus-content-validation.log

      - name: Stop SIHSALUS backend
        if: always() && hashFiles('sihsalus/docker-compose-no-volumes.yml') != ''
        run: docker compose -f sihsalus/docker-compose-no-volumes.yml down -v

      - name: Upload validation log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sihsalus-content-validation-log
          path: sihsalus/sihsalus-content-validation.log
          retention-days: 14
