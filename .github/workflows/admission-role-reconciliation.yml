name: Admission role MariaDB integration

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mariadb-liquibase:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mariadb:
        image: mariadb:10.11.7
        env:
          MARIADB_DATABASE: admission_reconciliation_ci
          MARIADB_USER: admission_fixture
          MARIADB_PASSWORD: synthetic-fixture-only
          MARIADB_ROOT_PASSWORD: synthetic-root-only
        ports:
          - 3306/tcp
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Run real MariaDB and Liquibase tests on a synthetic database
        env:
          ADMISSION_TEST_DB_PORT: ${{ job.services.mariadb.ports['3306'] }}
          ADMISSION_TEST_DATABASE_DISPOSABLE: admission_reconciliation_ci
        run: >-
          mvn --batch-mode --no-transfer-progress
          --file .github/integration/admission-role-reconciliation/pom.xml test
      - name: Record validation scope
        if: always()
        run: |
          {
            echo '## Admission migration integration'
            echo "Source: ${GITHUB_SHA}"
            echo 'MariaDB 10.11.7; Liquibase 4.32.0; MariaDB JDBC 3.5.4; Java 21.'
            echo 'Synthetic minimal schema, complete candidate Liquibase XML; see JUnit results.'
            echo 'NOT RUN: Initializer 2.13.0-sihsalus.1 CSV loading/checksums and OpenMRS authorization.'
            echo 'This job does not validate a deployed backend, authorize deployment, or publish content.'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve synthetic test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: admission-role-mariadb-${{ github.sha }}
          path: .github/integration/admission-role-reconciliation/target/surefire-reports/
          if-no-files-found: warn
          retention-days: 7
